<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>Приложение эксперта</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Lora:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <div id="app" class="app">
    <main id="view" class="view"></main>
    <button id="fab" class="fab" type="button"></button>
    <nav id="tabs" class="tabs"></nav>
  </div>
  <div id="sheet-root"></div>
  <div id="toast" class="toast" role="status"></div>

  <script>
    // Эксперт выбирается параметром ?e=<id>; данные лежат в experts/<id>/content.js
    (function () {
      var id = (new URLSearchParams(location.search).get('e') || 'barsukov').replace(/[^a-z0-9_-]/gi, '');
      window.EXPERT_BASE = 'experts/' + id + '/';
      var s = document.createElement('script');
      s.src = window.EXPERT_BASE + 'content.js';
      s.onload = function () {
        var a = document.createElement('script');
        a.src = 'app.js';
        document.body.appendChild(a);
      };
      s.onerror = function () {
        document.getElementById('view').innerHTML = '<p class="empty">Эксперт «' + id + '» не найден</p>';
      };
      document.body.appendChild(s);
    })();
  </script>
</body>
</html>
